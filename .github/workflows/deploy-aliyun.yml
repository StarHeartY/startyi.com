name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-aliyun
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure SSH
        env:
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$ALIYUN_SSH_KEY" > "$HOME/.ssh/aliyun_deploy_key"
          chmod 600 "$HOME/.ssh/aliyun_deploy_key"

          ssh-keyscan -t ed25519 120.77.79.138 > /tmp/aliyun_host_key 2>/dev/null

          actual_fingerprint="$(ssh-keygen -lf /tmp/aliyun_host_key -E sha256 | awk '{print $2}')"
          expected_fingerprint="SHA256:EbT3WQEtESMow8rGZu+n+DcNEVMDVhIweM0wNK5yItQ"

          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "Aliyun SSH host key fingerprint mismatch."
            exit 1
          fi

          cat /tmp/aliyun_host_key >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to Aliyun ECS
        env:
          ALIYUN_HOST: 120.77.79.138
          ALIYUN_USER: agent
          ALIYUN_TARGET: /var/www/startyi.cn
        run: |
          SSH=(ssh -i "$HOME/.ssh/aliyun_deploy_key" -o IdentitiesOnly=yes "$ALIYUN_USER@$ALIYUN_HOST")
          STAGING="/home/agent/startyi-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          "${SSH[@]}" "rm -rf '$STAGING' && mkdir -p '$STAGING'"

          tar -C out -czf - . | \
            "${SSH[@]}" "tar -xzf - -C '$STAGING'"

          "${SSH[@]}" "set -eu; \
            find '$ALIYUN_TARGET' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; \
            cp -a '$STAGING'/. '$ALIYUN_TARGET'/; \
            rm -rf '$STAGING'"